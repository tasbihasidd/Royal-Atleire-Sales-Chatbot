services:
  api:
    build: .
    container_name: royal_atelier_api
    ports:
      - "8015:8015"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - royal_atelier_generated_images:/app/static/generated
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: royal_atelier_postgres
    environment:
      POSTGRES_DB: royal_atelier
      POSTGRES_USER: royal
      POSTGRES_PASSWORD: royal
    ports:
      - "5434:5432"
    volumes:
      - royal_atelier_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U royal -d royal_atelier"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  royal_atelier_postgres_data:
  royal_atelier_generated_images:
