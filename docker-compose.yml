services:
  api:
    build: .
    container_name: royal_atelier_api
    ports:
      - "${PORT:-2006}:${PORT:-2006}"
    env_file:
      - .env
    environment:
      # DB via container DNS. PORT + BASE_URL come from .env.
      # Override POSTGRES_PASSWORD in .env for non-local deploys.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-royal}:${POSTGRES_PASSWORD:-royal}@postgres:5432/${POSTGRES_DB:-royal_atelier}
      APP_ENV: ${APP_ENV:-dev}
      ENABLE_DEV_ENDPOINTS: ${ENABLE_DEV_ENDPOINTS:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - postgres
    volumes:
      - royal_atelier_generated_images:/app/static/generated
      - royal_atelier_uploads:/app/static/uploads
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: royal_atelier_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-royal_atelier}
      POSTGRES_USER: ${POSTGRES_USER:-royal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-royal}
    # Bind to localhost only — do not expose Postgres on the public interface.
    ports:
      - "127.0.0.1:22006:5432"
    volumes:
      - royal_atelier_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  royal_atelier_postgres_data:
  royal_atelier_generated_images:
  royal_atelier_uploads:
