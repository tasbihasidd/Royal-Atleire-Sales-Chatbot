services:
  api:
    build: .
    container_name: royal_atelier_api
    ports:
      - "${PORT:-2006}:${PORT:-2006}"
    env_file:
      - .env
    environment:
      # DB via container DNS. PORT + BASE_URL come from .env.
      DATABASE_URL: postgresql+asyncpg://royal:royal@postgres:5432/royal_atelier
    depends_on:
      - postgres
    volumes:
      - royal_atelier_generated_images:/app/static/generated
      - royal_atelier_uploads:/app/static/uploads
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: royal_atelier_postgres
    environment:
      POSTGRES_DB: royal_atelier
      POSTGRES_USER: royal
      POSTGRES_PASSWORD: royal
    # Host uvicorn only — :5432 is often another project's DB (e.g. tudor).
    # API container still uses compose override @postgres:5432.
    ports:
      - "22006:5432"
    volumes:
      - royal_atelier_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  royal_atelier_postgres_data:
  royal_atelier_generated_images:
  royal_atelier_uploads:
