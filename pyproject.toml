[project]
name = "royal-atelier-agent"
version = "0.1.0"
description = "Royal Atelier / Turabees LangGraph sales agent + evaluation suite"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.40.0",
    "langgraph>=0.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
eval = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "rich>=13.7.0",
    "tabulate>=0.9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
